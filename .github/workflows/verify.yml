name: Verify submission image
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install polars==1.32.3
      - run: scripts/verify-container.sh
      - name: Extract verified executables
        run: |
          container=$(docker create shopping-sessions:latest)
          docker cp "$container":/opt/shop "$RUNNER_TEMP/shop"
          docker rm "$container"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/shopping-sessions-amd64.tgz" shop
      - uses: actions/upload-artifact@v4
        with:
          name: verified-linux-amd64
          path: ${{ runner.temp }}/shopping-sessions-amd64.tgz
          retention-days: 3
